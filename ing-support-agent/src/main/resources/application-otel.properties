# The audit trail: mvn spring-boot:run -pl ing-support-agent -Dspring-boot.run.profiles=otel
# Needs the Grafana stack in docker/: cd docker && docker compose up -d
# (Prometheus :9090, Tempo :3200/:4318, Loki :3100, Grafana :3000)

# A web app on this profile, so Prometheus can scrape /actuator/prometheus (the Prometheus container is set
# up for host port 8080) and the app stays up after the conversation, for the Grafana walk-through.
spring.main.web-application-type=servlet
server.port=8080

# --- Metrics -------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# One tag on every metric and span, so the dashboards can filter by application
management.observations.key-values.application=${spring.application.name}
management.metrics.tags.application=${spring.application.name}
# Histogram buckets for the Spring AI timers, so Grafana can draw percentiles and attach exemplars
management.metrics.distribution.percentiles-histogram.gen_ai.client.operation=true
management.metrics.distribution.percentiles-histogram.spring.ai.chat.client=true
management.metrics.distribution.percentiles-histogram.spring.ai.advisor=true
management.metrics.distribution.percentiles-histogram.spring.ai.tool=true
# Prometheus scrapes; the OTLP metrics push is not used
management.otlp.metrics.export.enabled=false
# The only HTTP traffic is the scrape itself: keep it out of the traces
management.observations.enable.http.server.requests=false

# --- Traces --------------------------------------------------------------------------------
management.tracing.export.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# --- Content in the spans: the audit question ----------------------------------------------
# Which spans may carry content. The ChatClient observation sits at the top of the chain and sees the
# message as the customer typed it, IBAN included, so its prompt stays out. The model observation runs
# after PiiMaskingAdvisor and records what Gemini actually received; the tool observation records the
# arguments the model chose (the month) and what the bank system returned.
spring.ai.chat.client.observations.log-prompt=false
spring.ai.chat.client.observations.log-completion=false
spring.ai.chat.observations.log-prompt=true
spring.ai.chat.observations.log-completion=true
spring.ai.tools.observations.include-content=true
