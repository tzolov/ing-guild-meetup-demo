spring.application.name=ing-support-agent
spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

# Gemini through Vertex AI: project and location from the repo-root .env, credentials from
# `gcloud auth application-default login`. Set spring.ai.google.genai.api-key instead for the Gemini Developer API.
spring.ai.google.genai.project-id=${GOOGLE_CLOUD_PROJECT}
spring.ai.google.genai.location=global
spring.ai.google.genai.chat.model=gemini-3.1-pro-preview
spring.ai.google.genai.chat.options.temperature=0.2

# The customer the scripted conversation runs for (see data.sql)
demo.customer-id=1001

spring.ai.inspector.enabled=true

# Observability is off by default and on with the 'otel' profile (application-otel.properties). Without it the
# OpenTelemetry starter is on the classpath but exports nothing, so the plain run needs no Docker stack.
management.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false
management.otlp.logging.export.enabled=false
