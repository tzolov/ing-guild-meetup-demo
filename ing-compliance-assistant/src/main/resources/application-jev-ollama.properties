# Jev served locally by Ollama (`ollama pull tev1:0.8b`), no TypeSafe key needed:
# mvn spring-boot:run -pl ing-compliance-assistant -Dspring-boot.run.profiles=jev-ollama
spring.autoconfigure.exclude=
spring.ai.typesafe.base-url=http://localhost:11434
spring.ai.typesafe.api-key=ollama
spring.ai.typesafe.model=tev1:0.8b
spring.ai.typesafe.timeout=60s
spring.ai.typesafe.retry.total-timeout=150s
