spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

# Gemini through Vertex AI: project and location from the repo-root .env, credentials from
# `gcloud auth application-default login`. Set spring.ai.google.genai.api-key instead for the Gemini Developer API.
spring.ai.google.genai.project-id=${GOOGLE_CLOUD_PROJECT}
spring.ai.google.genai.location=global
spring.ai.google.genai.chat.model=gemini-3.8-flash
spring.ai.google.genai.chat.options.temperature=0.2

# Embeddings for the regulation excerpts (gemini-embedding-001 is the starter's default model)
spring.ai.google.genai.embedding.project-id=${GOOGLE_CLOUD_PROJECT}
spring.ai.google.genai.embedding.location=${GOOGLE_CLOUD_LOCATION}

# The product description the assistant reviews
demo.product=classpath:products/green-mortgage-plus.md

spring.ai.inspector.enabled=true
